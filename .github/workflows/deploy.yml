name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://lebarty-medicare-staging.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Cloudflare worker
        run: npx opennextjs-cloudflare build
        env:
          CLOUDFLARE_ENV: staging
          NEXT_PUBLIC_SITE_ENV: staging
          NEXT_PUBLIC_SITE_URL: https://lebarty-medicare-staging.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev

      - name: Deploy staging worker
        run: npx opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: staging

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://lebartymedicare.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare worker
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://lebartymedicare.org

      - name: Deploy production worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
